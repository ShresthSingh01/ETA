version: '3.8'

services:
  raileta:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raileta-engine
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - RAILRADAR_API_KEY=${RAILRADAR_API_KEY:-}
      - RAILRADAR_BASE_URL=${RAILRADAR_BASE_URL:-https://api.railradar.in/v1}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
